name: Self-build signed APK

on:
  push:
    branches: [ selfbuild-hardening ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install frontend deps
        working-directory: app/frontEnd
        run: npm ci || npm install

      # [安全修复] 从仓库源码重编译四个 Go 工具（替换 assets 内不可审计的预编译二进制）
      # 纯 Go、CGO 关闭，linux/arm64 静态链接，可直接运行于 Android(arm64) 用户态
      - name: Rebuild Go tools from source (arm64)
        working-directory: app/src/main/assets/shell
        run: |
          set -e
          build_tool() {
            name="$1"; src="$2"
            tmp="$(mktemp -d)"
            cp "$src" "$tmp/main.go"
            (
              cd "$tmp"
              go mod init "ufitools/$name" >/dev/null 2>&1 || true
              if grep -q 'tarm/serial' main.go; then
                go get github.com/tarm/serial@latest
              fi
              CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/app/src/main/assets/shell/$name.new" .
            )
          }
          build_tool zreq zreq.go
          build_tool ufi_req ufi_req.go
          build_tool sendat send_at.go
          build_tool imei_reader diag_imei_reader.go
          shell_dir="$GITHUB_WORKSPACE/app/src/main/assets/shell"
          mv "$shell_dir/zreq.new" "$shell_dir/zreq"
          mv "$shell_dir/ufi_req.new" "$shell_dir/ufi_req"
          mv "$shell_dir/sendat.new" "$shell_dir/sendat"
          mv "$shell_dir/imei_reader.new" "$shell_dir/imei_reader"
          file "$shell_dir/zreq" "$shell_dir/ufi_req" "$shell_dir/sendat" "$shell_dir/imei_reader"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/app/ufi-selfbuild.keystore"
          ls -la "$GITHUB_WORKSPACE/app/ufi-selfbuild.keystore"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/app/ufi-selfbuild.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ufi-tools-selfbuild-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
